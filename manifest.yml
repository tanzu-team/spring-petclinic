---
applications:
- name: spring-petclinic
  metadata:
    labels:
      app: spring-petclinic
      ai.tanzu.com/type: petclinic-mcp-server
  memory: 1G
  random-route: true
  routes:
    - route: spring-petclinic-demo.apps.tpcf.tnz-field-epc.lvn.broadcom.net
    - route: spring-petclinic-demo.apps.internal
  buildpacks:
    - java_buildpack_offline
  path: target/spring-petclinic-4.0.0-SNAPSHOT.jar
  env:
    JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
    # Activates application-postgres.properties
    SPRING_PROFILES_ACTIVE: postgres
  services:
    - spring-petclinic-db
